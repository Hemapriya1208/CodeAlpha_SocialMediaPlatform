<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pulse – Log in</title><link rel="stylesheet" href="/style.css">
</head>
<body data-page="login">
  <main class="auth">
    <section class="auth-hero">
      <span class="logo" style="color:#fff">Pulse</span>
      <div><h1>Say it.<br>Share it.<br><i>Feel it.</i></h1></div>
      <p>Post short thoughts, follow people you like, and join the conversation.</p>
      <div class="ring"></div>
    </section>
    <section class="auth-form">
      <form id="authForm">
        <h2>Welcome back</h2>
        <input name="username" placeholder="Username or email" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <p class="err" id="err"></p>
        <button class="btn">Log in</button>
        <small class="muted">New here? <a href="/register.html">Create an account</a></small>
        <small class="muted">Demo: ava / demo1234</small>
      </form>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
